# CI on every pull request and every push to master: the site must type-check, lint, keep its format, pass its unit
# tests, keep the band's stills in step with the engine they were cut from, pass the audit of its runtime
# dependencies, build, keep the hard rules (no phone, address, project-management credential, old résumé PDF or CJK;
# no "(Jack)" in visible text; no link to this repository before the launch gate), keep its links, keep the PDF in
# step with the résumé and the link-preview cards in step with the pages' titles, and pass its browser tests.
# Nothing here deploys (Vercel does, from master). Nothing here needs a GPU: the stills, the cards and the speed check
# (`npm run build:band`, `build:og`, `check:budgets`) are cut and measured locally, on the real painting.
name: CI

on:
  # every PR once (a PR branch would match both events), and every push to master
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # the QA build (the painting's debug handle and the switch panel) for the browser tests; never in the Vercel build
      NEXT_PUBLIC_INK_QA: '1'
      # "In the open" reads GitHub at build time; the job's own token raises the rate limit (it falls back to the snapshot)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Checks (types, lint, format, unit tests; the band's stills are cut from this engine)
        run: npm run ci
      - name: Audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          node node_modules/next/dist/bin/next start -p 3100 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && exit 0; sleep 1; done; exit 1
      - name: The résumé PDF matches the résumé, with no phone number
        run: npm run build:pdf -- --check
      - name: Hard rules (the sources, the built pages and route outputs, the PDF)
        run: npm run check:compliance
      - name: Links
        run: npm run check:links
      - name: The link-preview cards match the pages' titles
        run: npm run build:og -- --check
      - name: Browser tests (tests/e2e)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
