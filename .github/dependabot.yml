# Dependency updates as reviewable pull requests (every pin in package.json is exact; CI checks each update).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ['next', '@next/*', 'eslint-config-next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      mdx:
        patterns: ['@mdx-js/*', 'remark-*', 'rehype-*', 'unist-*', 'hast-*', '@types/mdx']
      tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
