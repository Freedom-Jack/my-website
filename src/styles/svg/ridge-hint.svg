<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMax slice">
  <!-- Static landscape hint for pages without JavaScript or WebGL: three pale ridges, far to near,
       each fading into mist at its foot. Abstract on purpose: no trees, no structures, no figures. -->
  <defs>
    <linearGradient id="far" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3E5664" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#3E5664" stop-opacity=".05"/>
      <stop offset="1" stop-color="#3E5664" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2F424D" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#2F424D" stop-opacity=".07"/>
      <stop offset="1" stop-color="#2F424D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="near" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1E2A31" stop-opacity=".3"/>
      <stop offset=".45" stop-color="#1E2A31" stop-opacity=".09"/>
      <stop offset="1" stop-color="#1E2A31" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-2%" y="-5%" width="104%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <!-- the left side feathers into the paper (placed at the right of a wide box, its edge would show mid-screen) -->
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".34" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="feather" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="700">
      <rect width="1600" height="700" fill="url(#fade)"/>
    </mask>
  </defs>
  <g filter="url(#soft)" mask="url(#feather)">
    <path fill="url(#far)" d="M0 430c90-26 170-70 250-64 70 6 110 40 180 30 90-14 140-92 230-98 70-5 120 36 190 42 80 7 150-40 240-30 90 10 140 64 230 62 90-2 160-46 280-30V700H0z"/>
    <path fill="url(#mid)" d="M0 520c80-10 150-44 220-40 80 6 120 52 200 50 70-2 110-30 170-30 90 0 130 50 220 52 70 2 120-40 190-62 50-16 90-60 130-120 30-46 60-60 90-38 40 30 70 100 130 150 60 50 140 60 250 76V700H0z"/>
    <path fill="url(#near)" d="M1060 700c40-80 80-150 120-230 30-60 50-130 80-200 16-38 34-52 52-30 26 34 40 96 70 150 40 72 100 120 160 176 20 18 40 30 58 40V700z"/>
  </g>
</svg>
