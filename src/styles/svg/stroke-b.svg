<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 24" preserveAspectRatio="none">
  <!-- A thinner, quicker stroke with a lift in its middle (round 7): the rules between rows and the tail's. -->
  <defs>
    <linearGradient id="load" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#111416" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#111416" stop-opacity=".72"/>
      <stop offset="1" stop-color="#111416" stop-opacity=".36"/>
    </linearGradient>
    <filter id="dry" x="0" y="-80%" width="100%" height="260%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.7" numOctaves="2" seed="29" result="streak"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="edge"/>
      <feDisplacementMap in="SourceGraphic" in2="edge" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feComposite in="shape" in2="streak" operator="arithmetic" k1="0" k2="4" k3="3" k4="-4.1" result="mask"/>
      <feFlood flood-color="#111416"/>
      <feComposite in2="mask" operator="in"/>
    </filter>
  </defs>
  <path filter="url(#dry)" fill="url(#load)" d="M2 12.6c.2-3 5-4.4 16-4.6 96-1.6 250-.6 420 1.2 74 .8 130 1.8 160 3-30 1.6-86 2.4-160 2.8-170 1-324 2.2-420 2.6-11 .1-15.800-1.600-16-5z"/>
</svg>
