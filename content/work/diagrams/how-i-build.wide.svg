<title id="hib-w-t">How I build</title>
<desc id="hib-w-d">Three layers. At the bottom, data flows from many sources through pipelines into an index. In the middle, retrieval pulls context from that index. On top, an agent workflow takes a request, calls models with that context, passes guardrails and returns the answer.</desc>
