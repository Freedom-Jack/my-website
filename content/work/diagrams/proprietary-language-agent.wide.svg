<title id="dg-agent-t">How the agent works</title>
<desc id="dg-agent-d">Legacy scripts in a proprietary language go into a LangGraph workflow, which coordinates vLLM-served models with retrieval. Guardrails keep personal information out and keep every output well-formed. Out come documentation, business rules and code prepared for migration.</desc>
