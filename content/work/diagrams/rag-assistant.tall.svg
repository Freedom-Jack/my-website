<svg xmlns="http://www.w3.org/2000/svg" class="diagram__art diagram__art--tall" viewBox="0 0 400 710" role="img" aria-labelledby="dg-rag-t2 dg-rag-d2" data-draw="">
<title id="dg-rag-t2">How the RAG assistant works</title>
<desc id="dg-rag-d2">A customer’s question goes to retrieval, which finds passages in the insurer’s own knowledge base. An LLM, orchestrated with LangChain, answers from those passages, and the answer goes back to the customer.</desc>
