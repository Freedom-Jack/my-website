<title id="dg-rag-t">How the RAG assistant works</title>
<desc id="dg-rag-d">A customer’s question goes to retrieval, which finds passages in the insurer’s own knowledge base. An LLM, orchestrated with LangChain, answers from those passages, and the answer goes back to the customer.</desc>
