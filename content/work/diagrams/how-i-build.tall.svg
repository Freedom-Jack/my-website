<svg xmlns="http://www.w3.org/2000/svg" class="diagram__art diagram__art--tall" viewBox="0 0 400 880" role="img" aria-labelledby="hib-t-t hib-t-d" data-draw="">
<title id="hib-t-t">How I build</title>
<desc id="hib-t-d">Three layers. At the bottom, data flows from many sources through pipelines into an index. In the middle, retrieval pulls context from that index. On top, an agent workflow takes a request, calls models with that context, passes guardrails and returns the answer.</desc>
