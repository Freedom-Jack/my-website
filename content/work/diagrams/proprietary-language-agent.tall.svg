<svg xmlns="http://www.w3.org/2000/svg" class="diagram__art diagram__art--tall" viewBox="0 0 400 732" role="img" aria-labelledby="dg-agent-t2 dg-agent-d2" data-draw="">
<title id="dg-agent-t2">How the agent works</title>
<desc id="dg-agent-d2">Legacy scripts in a proprietary language go into a LangGraph workflow, which coordinates vLLM-served models with retrieval. Guardrails keep personal information out and keep every output well-formed. Out come documentation, business rules and code prepared for migration.</desc>
