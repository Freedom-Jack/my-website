<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wake lab</title>
  <meta name="robots" content="noindex"><!-- engine lab: the cursor's wake alone, with the drift stopped (not part of the site) -->
  <link rel="icon" href="/assets/svg/seal.svg" type="image/svg+xml">
  <meta name="color-scheme" content="light">
  <style>
    html { background: #EFF1EE; }
    body { margin: 0; min-height: 200vh; font: 400 14px/1.45 system-ui, sans-serif; color: #434C50; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
    .strip { position: absolute; left: 0; right: 0; top: 64px; height: var(--h, 522px); }
    .text { position: absolute; left: 120px; top: calc(64px + var(--h, 522px) * .2); width: 580px; height: calc(var(--h, 522px) * .6); }
    p { position: absolute; left: 120px; top: 8px; margin: 0; }
  </style>
</head>
<body>
  <p>The wake alone (no drift): move the pointer over the strip. <code>?stretch=0..6</code> · <code>?h=522</code> · <code>?q=1</code> · <code>?keep=0</code></p>
  <canvas id="c"></canvas>
  <div class="strip" data-wake></div>
  <div class="text" data-veil="0.85"></div>
  <script type="module">
    import { mountLandscape } from '/assets/js/landscape/index.js';
    const qs = new URLSearchParams(location.search);
    const strip = document.querySelector('.strip');
    const text = document.querySelector('.text');
    if (qs.has('h')) document.documentElement.style.setProperty('--h', Number(qs.get('h')) + 'px');
    const keep = qs.get('keep') !== '0';
    if (!keep) text.remove();
    const PAGES = [['level', 1], ['deep', 0.8], ['high', 0.8], ['level', 0.6], ['level', 0.5], ['level', 0.9], ['high', 1]];
    const k = Math.min(6, Math.max(0, Number(qs.get('stretch') || 0)));
    window.__land = mountLandscape(document.getElementById('c'), {
      stretch: k, distance: PAGES[k][0], presence: PAGES[k][1], palette: qs.get('palette') || 'misted',
      strip, keepout: keep ? [text] : [], veil: keep ? [text] : [], wake: [strip], arrival: 'none', ambient: false,
      quality: qs.has('q') ? Number(qs.get('q')) : 'auto', horizonMedia: 'not all',
    });
  </script>
</body>
</html>
